<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="8 6 112 116"
     width="512"
     height="512"
     fill="none">

  <defs>
    <linearGradient id="protectmeGrad"
                    x1="18"
                    y1="18"
                    x2="110"
                    y2="110"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="52%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <g stroke="url(#protectmeGrad)"
     stroke-width="5"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Kernel / root anchor -->
    <circle cx="64" cy="20" r="7"/>

    <!-- Root stem -->
    <path d="M64 27V43"/>

    <!-- Outer protected boundary -->
    <path d="
      M64 43
      L96 55
      V78
      C96 96 83 108 64 116
      C45 108 32 96 32 78
      V55
      Z"
      fill="url(#protectmeGrad)"
      fill-opacity="0.12"/>

  </g>

  <!-- Inner protected shield -->
  <path d="
    M64 49
    L89 58
    V77
    C89 91 79 101 64 108
    C49 101 39 91 39 77
    V58
    Z"
    fill="url(#protectmeGrad)"
    fill-opacity="0.9"/>

  <!-- Project name -->
  <text x="64"
        y="70"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#ffffff"
        font-family="Inter, Arial, sans-serif"
        font-size="8"
        font-weight="700"
        letter-spacing="0.2">
    protectme
  </text>

  <!-- Destructive command -->
  <text x="64"
        y="84"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="#ffffff"
        font-family="monospace"
        font-size="8"
        font-weight="700"
        letter-spacing="-0.4">
    rm -rf /
  </text>

</svg>