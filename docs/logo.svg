<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Shield background -->
  <path d="M100 10 
           L185 35 
           L185 120 
           C185 160 100 190 100 190 
           C100 190 15 160 15 120 
           L15 35 
           Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)"
        stroke="#047857" 
        stroke-width="2"/>
  
  <!-- Shield inner highlight -->
  <path d="M100 25 
           L165 45 
           L165 105 
           C165 135 100 160 100 160 
           C100 160 35 135 35 105 
           L35 45 
           Z" 
        fill="none" 
        stroke="rgba(255,255,255,0.3)" 
        stroke-width="1"/>
  
  <!-- Lock icon -->
  <g transform="translate(100, 100)">
    <!-- Lock body -->
    <rect x="-22" y="-8" width="44" height="36" 
          rx="4" ry="4" 
          fill="#ffffff" 
          opacity="0.95"/>
    <!-- Lock shackle -->
    <path d="M-16 -8 
             C-16 -20 16 -20 16 -8" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.95"/>
    <!-- Keyhole -->
    <circle cx="0" cy="8" r="5" fill="#10b981" opacity="0.9"/>
    <rect x="-2" y="8" width="4" height="8" fill="#10b981" opacity="0.9"/>
  </g>
  
  <!-- Subtle checkmark on shield -->
  <path d="M70 115 L90 135 L130 90" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.4"/>
</svg>